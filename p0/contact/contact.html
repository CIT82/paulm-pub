    <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet" />
</head>

<body>
    <header>
        <h1 class="site-heading text-center text-faded d-none d-lg-block">
            <span class="site-heading-upper text-faded mb-3">The Farmhouse</span>
            <span class="site-heading-lower">Contact Us</span>
        </h1>
        <div id="breadcrumb"></div>
    </header>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark py-lg-4" id="mainNav">
        <div class="container">
            <a class="navbar-brand text-uppercase fw-bold d-lg-none" href="../index.html">The Farmhouse</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"><span class="navbar-toggler-icon"></span></button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../index.html">Home</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../about/about.html">About</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../our-team/our-team.html">Our Team</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../menu/menu.html">Menu</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../store/store.html">Store</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="../blog/blog.html">Blog</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form -->
    <section class="page-section">
        <div class="container d-flex justify-content-center">
            <div class="p-5 shadow-sm rounded" style="background-color:rgba(47, 23, 15, 0.9); width: 60%;">

                <h2 class="section-heading mb-4 text-center text-light">
                    <span class="section-heading-upper">Get in Touch</span><br>
                    <span class="section-heading-lower">Contact a Team Member</span>
                </h2>

                <form id="contactForm">

                    <div class="row mb-3">
                        <div class="col-lg-6">
                            <label class="form-label text-light">First Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="firstName">
                        </div>
                        <div class="col-lg-6">
                            <label class="form-label text-light">Last Name</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="lastName">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control bg-dark text-light border-secondary" id="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Home Address (Optional)</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="address">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Contact Team Member <span class="text-danger">*</span></label>
                        <select class="form-select bg-dark text-light border-secondary" id="teamMember" required>
                            <option value="">Select a team member...</option>
                            <option>Emily</option>
                            <option>Hanna</option>
                            <option>Lydia</option>
                            <option>Maya</option>
                            <option>John</option>
                            <option>Marlene</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-light">Message <span class="text-danger">*</span></label>
                        <textarea class="form-control bg-dark text-light border-secondary" id="message" rows="5" required></textarea>
                    </div>

                    <button type="button" id="sendBtn" class="btn btn-faded ">Send Message</button>
                    <p id="sentMsg" class="mt-3 text-success fw-bold" style="display:none;">Message Sent!</p>

                </form>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer text-faded text-center py-5">
        <div class="container">
            <p class="m-0 small">
                <a href="../sitemap/sitemap.html" class="footer-link text-uppercase">Sitemap</a> |
                <a href="../contact/contact.html" class="footer-link text-uppercase">Contact</a>
            </p>
        </div>
        <div class="container">
            <p class="m-0 small">Copyright &copy; Your Website 2023</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/scripts.js"></script>
</body>
</html>
